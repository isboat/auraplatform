name: Backend API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "AuraPlatform.slnx"
      - ".github/workflows/backend-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "AuraPlatform.slnx"
      - ".github/workflows/backend-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-api-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: backend/Aura.Api/Aura.Api.csproj
  TEST_PROJECT_PATH: backend/Aura.Api.Tests/Aura.Api.Tests.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: dotnet restore "${PROJECT_PATH}"
      - name: Build
        run: dotnet build "${PROJECT_PATH}" --configuration Release --no-restore
      - name: Publish
        run: dotnet publish "${PROJECT_PATH}" --configuration Release --no-restore --output publish
      - uses: actions/upload-artifact@v4
        with:
          name: backend-api
          path: publish
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Test
        run: dotnet test "${TEST_PROJECT_PATH}" --configuration Release

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: backend-production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-api
          path: publish
      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_BACKEND_APP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2CD7D04152484841A0CF918F87C04FC8 }}
          package: publish

name: Management Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: dashboard/Aura.Dashboard/Aura.Dashboard.csproj
  TEST_PROJECT_PATH: dashboard/Aura.Dashboard.Tests/Aura.Dashboard.Tests.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: dotnet restore "${PROJECT_PATH}"
      - name: Build
        run: dotnet build "${PROJECT_PATH}" --configuration Release --no-restore
      - name: Publish
        run: dotnet publish "${PROJECT_PATH}" --configuration Release --no-restore --output publish
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: publish
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Test
        run: dotnet test "${TEST_PROJECT_PATH}" --configuration Release

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: dashboard-production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: publish
      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_DASHBOARD_APP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_220AD9BB05D94FFB806F78D486A6F789 }}
          package: publish
